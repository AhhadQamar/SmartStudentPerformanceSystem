{% extends "base.html" %}

{% block title %}Prediction Result | Smart Student Performance System{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6 col-xl-5">
    <!-- Result card stays compact so the output is easy to scan. -->
    <div class="surface-card p-4 p-lg-5 shadow-sm">
      <p class="section-label mb-2">Prediction</p>
      <h1 class="h3 fw-semibold mb-4">Result</h1>
      {% if student %}
      <div class="mb-3 text-muted small">{{ student.roll_number }} - {{ student.name }}</div>
      {% endif %}
      <div class="result-box mb-3">
        <span class="result-label">Percentage</span>
        <div class="result-value">{{ percentage }}%</div>
      </div>
      <div class="result-box">
        <span class="result-label">Predicted Grade</span>
        <div class="result-value">{{ grade }}</div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
