{% extends 'base.html' %} {% block title %}Sign Up | Smart Student Performance
System{% endblock %} {% block content %}
<div class="row  justify-content-center">
  <div class="col-lg-5">
    <div class="surface-card p-4 shadow-md">
      <p class="section-label mb-2">Get Started</p>
      <h1 class="h4 fw-semibold mb-4">Sign Up</h1>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input
            class="form-control form-control-soft"
            type="text"
            name="username"
            id="username"
            placeholder="Choose a username"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-control form-control-soft"
            type="email"
            name="email"
            id="email"
            placeholder="you@example.com"
            required
          />
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            class="form-control form-control-soft"
            type="password"
            name="password"
            id="password"
            placeholder="Create a password"
            required
          />
        </div>
         <div class="mb-4">
          <label class="form-label" for="confirm_password"
            >Confirm Password</label
          >
          <input
            class="form-control form-control-soft"
            type="password"
            name="confirm_password"
            id="confirm_password"
            placeholder="Re-enter your password"
            required
          />
        </div>
      <div class="mb-4">
  <div class="d-flex align-items-center flex-wrap gap-3">
    <span class="form-label mb-0">Your role</span>
    <div class="form-check form-check-inline mb-0">
      <input class="form-check-input" type="radio" name="role" id="role-admin" value="admin" required />
      <label class="form-check-label" for="role-admin">Admin</label>
    </div>
    <div class="form-check form-check-inline mb-0">
      <input class="form-check-input" type="radio" name="role" id="role-teacher" value="teacher" required />
      <label class="form-check-label" for="role-teacher">Teacher</label>
    </div>
  </div>
</div>
        <button class="btn btn-primary w-100" type="submit">
          Create Account
        </button>
      </form>
      <p class="text-muted text-center mt-3 mb-0">
        Already have an account?
        <a href="{{ url_for('main.login') }}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
