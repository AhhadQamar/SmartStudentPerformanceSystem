{% extends 'base.html' %}
{% block title %}Admin Dashboard | Smart Student Performance System{% endblock %}
  {% block content %}
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <div class="surface-card p-4 p-lg-5 shadow-sm">
          <p class="section-label mb-2">Administrator</p>
          <h1 class="h3 fw-semibold mb-3">Dashboard</h1>
          <p class="text-muted mb-4">Manage students and courses.</p>
          <a class="btn btn-primary px-4"
             href="{{ url_for('main.admin_students') }}">Manage students</a>
          <a class="btn btn-primary px-4 ms-2"
             href="{{ url_for('main.admin_courses') }}">Manage courses</a>
        </div>
      </div>
    </div>
  {% endblock %}
