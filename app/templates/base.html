<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{%block title%} {%endblock%}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='CSS/style.css') }}"
    />
  </head>
  <body class="app-shell">
    <nav class="navbar bg-dark navbar-expand-lg navbar-dark app-navbar">
      <div class="container py-3">
        <a class="navbar-brand  " href="{{url_for('main.index')}}">
          <span class="brand-mark  d-inline-flex align-items-baseline fw-bold  px-4 py-1 me-2 ">
          <span class='h4 fw-bold'>S</span>
          <span class = 'h6 text-white'>2</span>
<span class='h4 fw-bold'>
          P
</span>
          </span>
          <span>Smart Student Performance Prediction</span>
        </a>
        <div class="ms-auto d-flex gap-2 algin-items-center">
          {% if session.get('user_id') %}
          <span class="badge rounded-pill text-bg-light text-dark py-2 px-3 fw-semibold" 
            >{{ session.get('role').capitalize()}}</span
          >
          <a class="btn btn-outline-light btn-sm px-3" href="{{url_for('main.logout')}}">Logout</a>
          {% else %}
          <a class="btn btn-outline-light btn-sm px-3" href="{{url_for('main.login')}}">Login</a>
          {% endif %}
        </div>
      </div>
    </nav>
    <main class='contaienr py-4 py-lg-5 flex-grow-1'>
      {%block content%} 
      {%endblock%}
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </main>
  </body>
</html>
